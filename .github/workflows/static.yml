on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site artifact
        run: |
          missing=0
          # The vendored licences are checked too: publishing three.js or
          # anime.js without them would breach their terms.
          for f in \
            index.html research.html cv.html links.html credits.html \
            assets/css/site.css assets/js/site.js assets/js/hero-circuit.js \
            assets/fallback/circuit.svg \
            vendor/three/three.module.min.js vendor/three/three.core.min.js \
            vendor/three/LICENSE \
            vendor/anime/anime.esm.min.js vendor/anime/LICENSE.md \
            LICENSE
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Static site looks complete."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
