on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site artifact
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::public/index.html is missing. Run make publish locally and commit the generated public/ files before deploying."
            exit 1
          fi
          if [ ! -d public/roam ]; then
            echo "::error::public/roam is missing. Run make publish locally and commit the generated note HTML files."
            exit 1
          fi
          note_count="$(find public/roam -type f -name '*.html' | wc -l | tr -d ' ')"
          if [ "$note_count" -eq 0 ]; then
            echo "::error::No static note HTML files found under public/roam."
            exit 1
          fi
          echo "Deploying $note_count prebuilt note pages from public/roam."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
