on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site artifact
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html is missing. Run make publish-build locally and commit the generated files before deploying."
            exit 1
          fi
          if [ ! -d roam ]; then
            echo "::error::roam/ is missing. Run make publish-build locally and commit the generated note HTML files."
            exit 1
          fi
          note_count="$(find roam -type f -name '*.html' | wc -l | tr -d ' ')"
          if [ "$note_count" -eq 0 ]; then
            echo "::error::No static note HTML files found under roam/."
            exit 1
          fi
          echo "Deploying $note_count prebuilt note pages from roam/."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
