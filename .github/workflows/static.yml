on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site artifact
        run: |
          missing=0
          # The vendored licences are checked too: publishing three.js or
          # anime.js or KaTeX without them would breach their terms.
          for f in \
            index.html \
            assets/css/site.css assets/js/site.js \
            assets/js/world/index.js assets/js/world/curve.js \
            assets/js/world/circuit.js assets/js/world/flight.js \
            assets/js/world/rig.js assets/js/world/panels.js \
            assets/js/world/states.js \
            assets/js/world/css3d.js assets/js/world/math.js \
            vendor/three/three.module.min.js vendor/three/three.core.min.js \
            vendor/three/CSS3DRenderer.js vendor/three/LICENSE \
            vendor/anime/anime.esm.min.js vendor/anime/LICENSE.md \
            vendor/katex/katex.mjs vendor/katex/katex.min.css \
            vendor/katex/LICENSE vendor/katex/fonts/KaTeX_Main-Regular.woff2 \
            LICENSE
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Static site looks complete."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
