<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"
     aria-label="Circuit for Shor's algorithm: four counting qubits in |0>, Hadamards, four controlled a^(2^j) mod N operations on the work register in |1>, an inverse quantum Fourier transform, and measurement.">
  <g fill="none" stroke="#1b1a17" stroke-width="1.6" stroke-linecap="round">
    <!-- counting register -->
    <path d="M70 60 H840" opacity="0.8"/>
    <path d="M70 105 H840" opacity="0.8"/>
    <path d="M70 150 H840" opacity="0.8"/>
    <path d="M70 195 H840" opacity="0.8"/>
    <!-- work register -->
    <path d="M70 280 H840" stroke-width="2.4" opacity="0.8"/>
    <path d="M96 270 l14 20" stroke-width="1.4" opacity="0.7"/>
    <!-- controls -->
    <path d="M250 60 V280" opacity="0.55"/>
    <path d="M320 105 V280" opacity="0.55"/>
    <path d="M390 150 V280" opacity="0.55"/>
    <path d="M460 195 V280" opacity="0.55"/>
  </g>

  <g fill="#1b1a17" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif">
    <text x="26" y="66" font-size="19">|0⟩</text>
    <text x="26" y="111" font-size="19">|0⟩</text>
    <text x="26" y="156" font-size="19">|0⟩</text>
    <text x="26" y="201" font-size="19">|0⟩</text>
    <text x="26" y="286" font-size="19">|1⟩</text>
    <text x="112" y="266" font-size="13" opacity="0.7">n</text>
  </g>

  <!-- Hadamards -->
  <g>
    <g fill="#f6f3ec" stroke="#1b1a17" stroke-width="1.6">
      <rect x="140" y="40" width="40" height="40" rx="2"/>
      <rect x="140" y="85" width="40" height="40" rx="2"/>
      <rect x="140" y="130" width="40" height="40" rx="2"/>
      <rect x="140" y="175" width="40" height="40" rx="2"/>
    </g>
    <g fill="#1b1a17" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif"
       font-size="20" text-anchor="middle">
      <text x="160" y="67">H</text>
      <text x="160" y="112">H</text>
      <text x="160" y="157">H</text>
      <text x="160" y="202">H</text>
    </g>
  </g>

  <!-- control dots -->
  <g fill="#2f5d6b">
    <circle cx="250" cy="60" r="6"/>
    <circle cx="320" cy="105" r="6"/>
    <circle cx="390" cy="150" r="6"/>
    <circle cx="460" cy="195" r="6"/>
  </g>

  <!-- modular exponentiation on the work register -->
  <g fill="#f6f3ec" stroke="#1b1a17" stroke-width="1.6">
    <rect x="222" y="256" width="56" height="48" rx="2"/>
    <rect x="292" y="256" width="56" height="48" rx="2"/>
    <rect x="362" y="256" width="56" height="48" rx="2"/>
    <rect x="432" y="256" width="56" height="48" rx="2"/>
  </g>
  <g fill="#1b1a17" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif"
     font-size="15" text-anchor="middle">
    <text x="250" y="286">a¹</text>
    <text x="320" y="286">a²</text>
    <text x="390" y="286">a⁴</text>
    <text x="460" y="286">a⁸</text>
  </g>
  <text x="355" y="325" fill="#1b1a17" opacity="0.7" font-size="14" text-anchor="middle"
        font-family="Iowan Old Style, Charter, Palatino, Georgia, serif">mod N</text>

  <!-- inverse QFT -->
  <rect x="540" y="36" width="92" height="183" rx="2" fill="#f6f3ec" stroke="#1b1a17" stroke-width="1.6"/>
  <text x="586" y="134" fill="#1b1a17" font-size="22" text-anchor="middle"
        font-family="Iowan Old Style, Charter, Palatino, Georgia, serif">QFT†</text>

  <!-- measurement -->
  <g fill="#f6f3ec" stroke="#1b1a17" stroke-width="1.6">
    <rect x="690" y="40" width="40" height="40" rx="2"/>
    <rect x="690" y="85" width="40" height="40" rx="2"/>
    <rect x="690" y="130" width="40" height="40" rx="2"/>
    <rect x="690" y="175" width="40" height="40" rx="2"/>
  </g>
  <g fill="none" stroke="#1b1a17" stroke-width="1.5">
    <path d="M700 68 a10 10 0 0 1 20 0"/><path d="M710 68 l8 -10"/>
    <path d="M700 113 a10 10 0 0 1 20 0"/><path d="M710 113 l8 -10"/>
    <path d="M700 158 a10 10 0 0 1 20 0"/><path d="M710 158 l8 -10"/>
    <path d="M700 203 a10 10 0 0 1 20 0"/><path d="M710 203 l8 -10"/>
  </g>

  <!-- classical output -->
  <g stroke="#1b1a17" stroke-width="1.2" opacity="0.65">
    <path d="M730 57 H840"/><path d="M730 63 H840"/>
    <path d="M730 102 H840"/><path d="M730 108 H840"/>
    <path d="M730 147 H840"/><path d="M730 153 H840"/>
    <path d="M730 192 H840"/><path d="M730 198 H840"/>
  </g>
</svg>
