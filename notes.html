<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chang He | Notes Archive</title>
  <link rel="stylesheet" href="css/home-cli.css?v=20260610-cli3" />
  <link rel="stylesheet" href="css/home-wiki.css?v=20260610-cli3" />
  <link rel="stylesheet" href="css/notes-cli.css?v=20260610-cli3" />
  <link rel="shortcut icon"
    href="https://raw.githubusercontent.com/AaronHnoraA/AaronHnoraA.github.io/refs/heads/master/css/cv.svg"
    type="image/x-icon">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body class="site-home site-archive home-cli home-archive">

  <!-- macOS terminal window -->
  <div class="terminal-window">

    <!-- Title bar -->
    <div class="terminal-chrome">
      <div class="window-controls">
        <span class="wc wc-close"></span>
        <span class="wc wc-min"></span>
        <span class="wc wc-max"></span>
      </div>
      <div class="window-title">hc@Aaron — notes archive — 200×50</div>
    </div>

    <!-- Scrollable content -->
    <div class="terminal-body">
      <div class="terminal-scroll" id="archive-scroll">

        <div class="site-shell">
          <header class="hero archive-hero">
            <p class="hero-kicker"><a href="index.html">&larr; home</a> <span class="hero-kicker-sep">/</span> notes archive</p>
            <h1>Notes</h1>
            <p class="hero-subtitle">
              A searchable index of published notes, topics, and relations.
            </p>
          </header>

          <nav class="site-nav" aria-label="Primary">
            <a href="index.html">home</a>
            <a href="#notes-section">archive</a>
            <a href="#books-panel">books</a>
            <a href="#graph-container">graph</a>
          </nav>

          <main class="site-main">
            <section id="notes-section" class="section section-wide archive-portal">
              <div id="notes-summary" class="notes-summary" aria-live="polite"></div>
              <div id="notes-actions" class="notes-actions" aria-label="Knowledge tools"></div>

              <h2>Archive</h2>
              <p class="section-aside">Use the graph for structure; the index for sequence.</p>

              <h3>Bookshelf</h3>
              <div id="books-panel" class="academic-panel" aria-live="polite"></div>

              <h3>Graph</h3>
              <div id="graph-container" aria-label="Interactive knowledge graph" data-graph-toolbar="true"></div>
              <div id="graph-focus" class="graph-focus empty" aria-live="polite"></div>

              <h3>Index</h3>

              <div class="toolbar">
                <div class="search-wrapper">
                  <label class="sr-only" for="note-search">Search notes</label>
                  <span class="search-icon" aria-hidden="true">/</span>
                  <input type="text" id="note-search" placeholder="Search title or tags…" autocomplete="off" />
                  <button id="reset-search" type="button" style="display:none" aria-label="Clear search">
                    <span aria-hidden="true">×</span>
                  </button>
                </div>

                <div class="sort-wrapper">
                  <label for="sort-select">Sort:</label>
                  <select id="sort-select">
                    <option value="date-desc">Newest</option>
                    <option value="date-asc">Oldest</option>
                    <option value="title-asc">A–Z</option>
                  </select>
                </div>
              </div>

              <div id="active-filters" class="active-filters" aria-live="polite"></div>
              <div id="tag-cloud"></div>
              <div id="app-tabs"></div>
            </section>
          </main>

          <footer class="site-footer">
            <span class="footer-text">&copy; 2026 Chang He (Aaron)</span>
          </footer>
        </div>

      </div><!-- /terminal-scroll -->
    </div><!-- /terminal-body -->
  </div><!-- /terminal-window -->

  <script src="js/data.js?v=20260610-cli3"></script>
  <script src="js/knowledge.js?v=20260610-cli3"></script>
  <script src="js/app.js?v=20260610-cli3"></script>
  <script src="js/graph.js?v=20260610-cli3"></script>
  <script src="js/oneko.js?v=20260610-cli3"></script>
</body>

</html>
